{% extends "public/base.html" %}
  {% load static %}
  {% block title %}Sign In{% endblock %}

  {% block content %}
<section class="min-h-[calc(100dvh-60px)] flex items-center justify-center px-4 py-8" style="background: linear-gradient(135deg, var(--color-bg-soft) 0%, var(--color-bg) 100%);">
    
    <div class="w-full max-w-[420px] bg-white rounded-2xl shadow-lg border border-[rgba(15,23,42,0.08)] p-6 sm:p-8">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[var(--color-bg-soft)] rounded-2xl flex items-center justify-center mx-auto mb-4">
                <img src="{% static 'images/logo.png' %}" alt="RealShri" class="h-10 w-auto object-contain">
            </div>
            <h1 class="text-xl font-bold text-[var(--color-navy)] mb-1">Welcome Back</h1>
            <p class="text-sm text-[var(--color-text-muted)]">Sign in to continue to RealShri</p>
        </div>
        
        <!-- Google Sign In Button -->
        <form method="post" class="mb-6">
            {% csrf_token %}
            <button type="submit" class="w-full flex items-center justify-center gap-3 px-4 py-3.5 bg-white border-2 border-[rgba(15,23,42,0.12)] rounded-xl font-semibold text-[var(--color-text)] hover:border-[var(--color-gold)] hover:shadow-md transition-all duration-200 min-h-[52px]">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
        </form>
        
        <!-- Divider -->
        <div class="flex items-center gap-3 mb-6">
            <div class="flex-1 h-px bg-[rgba(15,23,42,0.08)]"></div>
            <span class="text-xs text-[var(--color-text-light)] uppercase tracking-wider">or</span>
            <div class="flex-1 h-px bg-[rgba(15,23,42,0.08)]"></div>
        </div>
        
        <!-- Email Login Link -->
        <a href="{% url 'login' %}" class="w-full flex items-center justify-center gap-2 px-4 py-3.5 bg-[var(--color-navy)] text-white rounded-xl font-semibold hover:bg-[var(--color-navy-light)] transition-all duration-200 min-h-[52px]">
            <span class="material-icons-round" style="font-size:20px">email</span>
            Sign in with Email
        </a>
        
        <!-- Trust Badges -->
        <div class="mt-8 pt-6 border-t border-[rgba(15,23,42,0.08)]">
            <div class="flex items-center justify-center gap-4 text-xs text-[var(--color-text-muted)]">
                <span class="flex items-center gap-1">
                    <span class="material-icons-round text-[var(--color-success)]" style="font-size:14px">verified</span>
                    Secure Login
                </span>
                <span class="flex items-center gap-1">
                    <span class="material-icons-round text-[var(--color-success)]" style="font-size:14px">shield</span>
                    SSL Protected
                </span>
            </div>
        </div>
        
        <!-- Back Link -->
        <p class="text-center text-sm text-[var(--color-text-muted)] mt-4">
            Don't have an account? 
            <a href="{% url 'register' %}" class="font-semibold text-[var(--color-gold)] hover:underline">Register</a>
        </p>
        
    </div>
    
</section>
{% endblock %}
