{% extends "public/base.html" %}
{% load static %}
{% load socialaccount %}
{% block title %}Complete Registration{% endblock %}

{% block content %}

<section class="min-h-screen flex items-center justify-center luxury-bg px-6">

    <div class="max-w-md w-full backdrop-blur-xl bg-white/5 border border-white/10 p-10 rounded-3xl shadow-2xl reveal text-center">

        <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
            <svg class="w-10 h-10" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
        </div>

        <h2 class="text-3xl font-bold mb-2 gold">
            Complete Registration
        </h2>

        <p class="text-gray-400 mb-6">
            Please confirm your details to finish signing up with Google.
        </p>

        <form method="post" class="space-y-4 text-left">
            {% csrf_token %}
            
            <div>
                <label class="text-gray-400 text-sm block mb-1">Email</label>
                <input type="email" value="{{ form.email.value }}" disabled
                    class="w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white opacity-50">
            </div>

            <div>
                <label class="text-gray-400 text-sm block mb-1">Username</label>
                {{ form.username }}
            </div>

            <button type="submit" 
                    class="w-full py-3 bg-gradient-to-r from-yellow-500 to-yellow-300 text-black font-bold rounded-xl hover:scale-105 transition mt-4">
                Complete Registration
            </button>
        </form>

    </div>

</section>

{% endblock %}
