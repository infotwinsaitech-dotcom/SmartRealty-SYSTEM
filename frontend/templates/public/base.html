{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com"></script>

<!-- GSAP (ULTRA SMOOTH ANIMATION) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- AOS -->
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">

<meta name="user-authenticated" content="{% if user.is_authenticated %}true{% else %}false{% endif %}">

<style>
body {
    font-family: 'Manrope', sans-serif;
}

/* Luxury gradient */
.luxury-bg {
    background: linear-gradient(135deg, #0f172a, #020617);
}

/* Gold text */
.gold {
    background: linear-gradient(to right, #d4af37, #f5e6a8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Hero overlay */
.hero-overlay {
    background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.9));
}

/* Smooth zoom */
@keyframes zoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.2); }
}
</style>

<title>{% block title %}{% endblock %}</title>
</head>

<body class="bg-black text-white">

{% include "public/navbar.html" %}

{% block content %}{% endblock %}

{% include "public/footer.html" %}

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init();

gsap.registerPlugin(ScrollTrigger);

// Fade + slide
gsap.utils.toArray(".reveal").forEach(el => {
    gsap.from(el, {
        y: 80,
        opacity: 0,
        duration: 1.2,
        scrollTrigger: {
            trigger: el,
            start: "top 85%"
        }
    });
});
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
