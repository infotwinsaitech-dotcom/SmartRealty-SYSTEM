{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#fdfcf9"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="format-detection" content="telephone=no"/>

<script src="https://cdn.tailwindcss.com"></script>

<!-- GSAP (ULTRA SMOOTH ANIMATION) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- AOS -->
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta name="user-authenticated" content="{% if user.is_authenticated %}true{% else %}false{% endif %}">

<style>
:root{
    /* ===== Light theme — RealShri (navy + gold, logo-matched) ===== */
    --bg:#fdfcf9;
    --bg-soft:#f7f4ec;
    --surface:#ffffff;
    --surface-2:#fbf9f3;

    --navy-deep:#0b1440;
    --navy:#16224f;
    --text-body:#33395a;
    --text-muted:#6b7280;

    --gold-1:#c9922a;
    --gold-2:#f0cf72;
    --gold-3:#d4af37;
    --ivory:#0b1440; /* kept for compatibility, now used where dark text is needed */

    --hairline:rgba(11,20,64,0.10);
    --border:rgba(11,20,64,0.12);
    --shadow-soft:0 4px 20px rgba(11,20,64,0.06);
    --shadow-card:0 6px 24px rgba(11,20,64,0.08);

    --radius-lg:18px;
    --radius-md:12px;
    --tap-min:44px;
}

*{
    -webkit-tap-highlight-color: transparent;
}

html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
}

body {
    font-family:'Manrope', sans-serif;
    background:var(--bg);
    color:var(--text-body);
    font-size:clamp(16px, 0.9vw + 13px, 17px);
    line-height:1.65;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:hidden;
}

h1,h2,h3,h4,.font-display{
    font-family:'Playfair Display', serif;
    letter-spacing:0.01em;
    color:var(--navy-deep);
}

/* Fluid heading scale — mobile pehle, phir bada screen */
h1{ font-size:clamp(1.9rem, 5vw + 1rem, 3.4rem); line-height:1.18; }
h2{ font-size:clamp(1.5rem, 3.2vw + 1rem, 2.5rem); line-height:1.25; }
h3{ font-size:clamp(1.2rem, 2vw + 1rem, 1.6rem); line-height:1.35; }

/* Section background variant (soft ivory band, replaces old dark gradient) */
.luxury-bg {
    background: linear-gradient(180deg, var(--bg-soft), var(--bg));
}

/* Gold gradient text — logo "SHRI" match */
.gold {
    background: linear-gradient(to right, var(--gold-1), var(--gold-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Cursive gold accent — logo ke "Trust"/"Dream Home" jaisa */
.gold-script{
    font-family:'Playfair Display', serif;
    font-style:italic;
    background: linear-gradient(to right, var(--gold-1), var(--gold-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Hero overlay — image ke upar text readable rakhne ke liye (light theme mein bhi zaroori) */
.hero-overlay {
    background: linear-gradient(to bottom, rgba(11,20,64,0.15), rgba(11,20,64,0.75));
}

/* Smooth zoom */
@keyframes zoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.2); }
}

/* Reusable card — clean white surface, soft shadow instead of dark glass */
.card-luxury{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:clamp(1rem, 3vw, 1.75rem);
    box-shadow:var(--shadow-card);
}

/* Primary gold button — full-width friendly on mobile, min tap size */
.btn-gold{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    min-height:var(--tap-min);
    padding:0.75rem 1.5rem;
    border-radius:999px;
    font-weight:700;
    color:#ffffff;
    background:linear-gradient(to right, var(--gold-1), var(--gold-3));
    box-shadow:0 4px 14px rgba(201,146,42,0.30);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
}
.btn-gold:active{ transform:scale(0.97); }
@media(hover:hover){
    .btn-gold:hover{ box-shadow:0 8px 22px rgba(201,146,42,0.42); }
}

/* Outline button */
.btn-outline-gold{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    min-height:var(--tap-min);
    padding:0.75rem 1.5rem;
    border-radius:999px;
    font-weight:600;
    color:var(--navy-deep);
    border:1.5px solid var(--gold-1);
    background:var(--surface);
    transition:background 0.2s ease;
}
.btn-outline-gold:active{ background:var(--bg-soft); }
@media(hover:hover){
    .btn-outline-gold:hover{ background:var(--bg-soft); }
}

/* Hexagon accent divider — logo ke hexagon icon se liya signature motif */
.hex-divider{
    width:14px; height:14px;
    background:linear-gradient(135deg, var(--gold-1), var(--gold-2));
    clip-path:polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    display:inline-block;
}

/* Section spacing — mobile-first, laptop pe zyada breathing room */
.section-pad{
    padding-top:clamp(2.5rem, 6vw, 5rem);
    padding-bottom:clamp(2.5rem, 6vw, 5rem);
}

.container-app{
    width:100%;
    max-width:1280px;
    margin-inline:auto;
    padding-inline:clamp(1rem, 4vw, 2.5rem);
}

/* Links inside content */
a{ text-underline-offset:3px; color:var(--navy-deep); }

/* Accessible focus state — keyboard + screen readers */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--gold-1);
    outline-offset:2px;
    border-radius:6px;
}

/* Selection color matches brand */
::selection{ background:var(--gold-2); color:var(--navy-deep); }

/* Slim gold scrollbar (desktop) */
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:var(--bg-soft); }
::-webkit-scrollbar-thumb{ background:linear-gradient(var(--gold-1), var(--gold-3)); border-radius:8px; }

/* Respect users who prefer less motion */
@media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}
</style>

<title>{% block title %}{% endblock %}</title>
</head>

<body>

{% include "public/navbar.html" %}

{% block content %}{% endblock %}

{% include "public/footer.html" %}

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init();

gsap.registerPlugin(ScrollTrigger);

// Fade + slide
gsap.utils.toArray(".reveal").forEach(el => {
    gsap.from(el, {
        y: 80,
        opacity: 0,
        duration: 1.2,
        scrollTrigger: {
            trigger: el,
            start: "top 85%"
        }
    });
});
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
