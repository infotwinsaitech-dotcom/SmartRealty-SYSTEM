<div class="max-w-7xl mx-auto grid md:grid-cols-3 gap-10">

    <!-- BRAND -->

        <h2 class="text-2xl font-bold gold mb-3">
            {{ site.site_name|default:"EstateX" }}

        <p class="text-gray-400">
            {{ site.about_text|default:"Luxury real estate experience platform." }}
        </p>
    </div>

        <h3 class="font-bold mb-3">Contact</h3>
