<footer class="bg-[#050810] text-white px-5 sm:px-8 py-12 sm:py-16 border-t border-[#d4af37]/15">

<div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 sm:gap-10 text-center md:text-left">

    <!-- BRAND -->
    <div>
        <h2 class="text-xl sm:text-2xl font-display gold mb-3">
            {{ site.company_name|default:"REAL SHRI" }}
        </h2>
        <div class="hex-divider mx-auto md:mx-0 mb-3"></div>
        <p class="text-[#9aa3ba] leading-relaxed max-w-xs mx-auto md:mx-0">
            {{ site.about_text|default:"Luxury real estate experience platform." }}
        </p>
    </div>

    <!-- CONTACT -->
    <div>
        <h3 class="font-display text-lg text-[#ece7d8] mb-3">Contact</h3>
        <div class="space-y-1.5">
            <p class="text-[#9aa3ba]">📞 {{ site.phone }}</p>
            <p class="text-[#9aa3ba]">✉ {{ site.email }}</p>
            <p class="text-[#9aa3ba]">📍 {{ site.location }}</p>
        </div>
    </div>

    <!-- LINKS -->
    <div>
        <h3 class="font-display text-lg text-[#ece7d8] mb-3">Explore</h3>
        <div class="flex flex-col gap-2 items-center md:items-start">
            <a href="/" class="text-[#9aa3ba] hover:text-[#e9c66b] transition py-1">Home</a>
            <a href="/properties/" class="text-[#9aa3ba] hover:text-[#e9c66b] transition py-1">Properties</a>
            <a href="/contact/" class="text-[#9aa3ba] hover:text-[#e9c66b] transition py-1">Contact</a>
            <a href="/privacy/" class="text-[#9aa3ba] hover:text-[#e9c66b] transition py-1">Privacy</a>
        </div>
    </div>

</div>

<div class="text-center text-[#6b7488] mt-10 pt-6 border-t border-white/5 text-sm pb-[env(safe-area-inset-bottom)]">
    © {{ site.site_name }} • Luxury Real Estate Platform
</div>

</footer>
