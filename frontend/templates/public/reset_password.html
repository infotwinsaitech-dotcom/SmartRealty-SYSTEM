<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-200 via-white to-blue-200">

<div class="w-full max-w-md p-8 rounded-3xl shadow-2xl backdrop-blur-xl bg-white/80 border border-white/40">

    <!-- TITLE -->
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-800">Reset Password</h2>
        <p class="text-sm text-gray-500 mt-1">Create a secure new password</p>
    </div>

    <form method="POST" class="space-y-6">
        {% csrf_token %}

        {% if error %}
        <div class="bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <!-- PASSWORD -->
        <div class="relative">
            <label class="block text-sm font-semibold mb-2 text-gray-700">
                New Password
            </label>

            <input name="password" type="password"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none"
            placeholder="Enter new password" required>

            <span class="absolute right-3 top-10 text-gray-400">
                <span class="material-symbols-outlined">lock</span>
            </span>
        </div>

        <!-- CONFIRM -->
        <div class="relative">
            <label class="block text-sm font-semibold mb-2 text-gray-700">
                Confirm Password
            </label>

            <input name="confirm_password" type="password"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none"
            placeholder="Confirm password" required>

            <span class="absolute right-3 top-10 text-gray-400">
                <span class="material-symbols-outlined">verified</span>
            </span>
        </div>

        <!-- BUTTON -->
        <button type="submit"
        class="w-full py-3 rounded-xl font-bold text-white
        bg-gradient-to-r from-indigo-600 to-blue-600
        shadow-lg hover:shadow-xl hover:scale-[1.02]
        active:scale-[0.98] transition-all">

            Reset Password
        </button>

    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
        Secure • Encrypted • Trusted
    </p>

</div>

</body>
</html>
