<nav class="fixed top-0 w-full z-50 backdrop-blur-xl bg-black/40 border-b border-white/10">

    <div class="flex justify-between items-center px-6 py-4">

        <!-- LOGO -->
        <h1 class="text-xl font-bold text-yellow-400">
            {{ site.site_name|default:"EstateX" }}
        </h1>

        <!-- DESKTOP MENU -->
        <div class="hidden md:flex items-center gap-6 text-sm text-white">

            <a href="/" class="hover:text-yellow-400 transition">Home</a>
            <a href="/properties/" class="hover:text-yellow-400 transition">Properties</a>
            <a href="/about/" class="hover:text-yellow-400 transition">About</a>
            <a href="/contact/" class="hover:text-yellow-400 transition">Contact</a>

            {% if request.user.is_authenticated %}
            <a href="{% url 'profile' %}"
               class="px-4 py-2 bg-gradient-to-r from-yellow-500 to-yellow-300 text-black rounded-lg font-bold hover:scale-105 transition">
                Profile
            </a>
            {% else %}
            <a href="{% url 'login' %}"
               class="px-4 py-2 border border-white/20 rounded-lg hover:bg-white/10 transition">
                Login
            </a>
            {% endif %}

        </div>

        <!-- MOBILE MENU BUTTON -->
        <button onclick="toggleMenu()" class="md:hidden text-white text-2xl">
            ☰
        </button>

    </div>

    <!-- MOBILE MENU -->
    <div id="mobileMenu"
         class="hidden flex flex-col gap-4 px-6 pb-6 text-white text-sm bg-black/90 md:hidden">

        <a href="/" class="hover:text-yellow-400 transition">Home</a>
        <a href="/properties/" class="hover:text-yellow-400 transition">Properties</a>
        <a href="/about/" class="hover:text-yellow-400 transition">About</a>
        <a href="/contact/" class="hover:text-yellow-400 transition">Contact</a>

        {% if request.user.is_authenticated %}
        <a href="{% url 'profile' %}"
           class="px-4 py-2 bg-gradient-to-r from-yellow-500 to-yellow-300 text-black rounded-lg font-bold text-center">
            Profile
        </a>
        {% else %}
        <a href="{% url 'login' %}"
           class="px-4 py-2 border border-white/20 rounded-lg text-center">
            Login
        </a>
        {% endif %}

    </div>

</nav>

<!-- JS -->
<script>
function toggleMenu() {
    const menu = document.getElementById("mobileMenu");
    menu.classList.toggle("hidden");
}
</script>
