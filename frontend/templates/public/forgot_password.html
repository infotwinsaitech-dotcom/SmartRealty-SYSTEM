{% extends "public/base.html" %}
{% load static %}
{% block title %}Forgot Password{% endblock %}

{% block content %}

<section class="min-h-[100dvh] flex items-center justify-center luxury-bg px-4 sm:px-6 py-10">

    <div class="max-w-md w-full card-luxury reveal">

        <div class="text-center mb-7 sm:mb-8">
            <div class="hex-divider mb-3 mx-auto"></div>
            <h1 class="text-3xl sm:text-4xl font-display gold mb-2" style="font-family: 'Playfair Display', serif;">
                Forgot Password
            </h1>
            <p class="text-[var(--text-muted)] text-sm leading-relaxed">
                Enter your email to receive secure OTP verification
            </p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-xl bg-red-50 text-red-600 border border-red-200 text-center text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <input name="email" type="email" placeholder="Email Address" required
                class="w-full min-h-[50px] p-3 rounded-xl bg-[var(--bg-soft)] border border-[var(--border)] text-[var(--navy-deep)] placeholder-gray-400 focus:ring-2 focus:ring-[var(--gold-1)] focus:border-[var(--gold-1)] outline-none text-base">

            <button type="submit" class="btn-gold w-full min-h-[52px]">
                Send OTP
            </button>
        </form>

        <p class="text-center text-[var(--text-muted)] text-sm mt-6">
            Remember your password?
            <a href="{% url 'login' %}" class="text-[var(--gold-1)] hover:underline font-medium">Login</a>
        </p>

    </div>

</section>

{% endblock %}
