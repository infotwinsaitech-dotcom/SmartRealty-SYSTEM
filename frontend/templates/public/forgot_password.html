{% extends "public/base.html" %}
{% load static %}
{% block title %}Forgot Password{% endblock %}

{% block content %}

<section class="min-h-[100dvh] flex items-center justify-center luxury-bg px-4 sm:px-6 py-10">

    <div class="max-w-md w-full backdrop-blur-xl bg-white/[0.04] border border-[#d4af37]/15 p-6 sm:p-10 rounded-3xl shadow-2xl reveal">

        <div class="text-center mb-7 sm:mb-8">
            <h1 class="text-3xl sm:text-4xl font-display gold mb-2">
                Forgot Password
            </h1>
            <p class="text-[#9aa3ba] text-sm leading-relaxed">
                Enter your email to receive secure OTP verification
            </p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-xl bg-red-500/15 text-red-300 text-center text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <input name="email" type="email" placeholder="Email Address" required
                class="w-full min-h-[50px] p-3 rounded-xl bg-white/[0.06] border border-white/15 text-[#ece7d8] placeholder-[#6b7488] focus:ring-2 focus:ring-[#d4af37] focus:border-[#d4af37]/50 outline-none text-base">

            <button type="submit"
                class="w-full min-h-[52px] py-3 bg-gradient-to-r from-[#d4af37] to-[#f5e6a8] text-[#0a0f1f] font-bold rounded-xl active:scale-[0.98] transition">
                Send OTP
            </button>
        </form>

        <p class="text-center text-[#9aa3ba] text-sm mt-6">
            Remember your password?
            <a href="{% url 'login' %}" class="text-[#e9c66b] hover:underline font-medium">Login</a>
        </p>

    </div>

</section>

{% endblock %}
