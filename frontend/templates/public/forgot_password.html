{% extends "public/base.html" %}
{% load static %}
{% block title %}Forgot Password{% endblock %}

{% block content %}

<section class="min-h-screen flex items-center justify-center luxury-bg px-6">

    <div class="max-w-md w-full backdrop-blur-xl bg-white/5 border border-white/10 p-10 rounded-3xl shadow-2xl reveal">

        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold gold mb-2">
                Forgot Password
            </h1>
            <p class="text-gray-400 text-sm">
                Enter your email to receive secure OTP verification
            </p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded bg-red-500/20 text-red-300 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <input name="email" type="email" placeholder="Email Address" required
                class="w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:ring-2 focus:ring-yellow-400 outline-none">

            <button type="submit"
                class="w-full py-3 bg-gradient-to-r from-yellow-500 to-yellow-300 text-black font-bold rounded-xl hover:scale-105 transition">
                Send OTP
            </button>
        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            Remember your password?
            <a href="{% url 'login' %}" class="text-yellow-400 hover:underline">Login</a>
        </p>

    </div>

</section>

{% endblock %}
