{% extends "public/base.html" %}
{% block title %}Verify OTP{% endblock %}

{% block content %}

<section class="min-h-screen flex items-center justify-center luxury-bg px-6">

<div class="max-w-md w-full backdrop-blur-xl bg-white/5 border border-white/10 p-10 rounded-3xl shadow-2xl text-center reveal">

    <h2 class="text-3xl font-bold gold mb-2">Verify Identity</h2>
    <p class="text-gray-400 mb-8 text-sm">
        Enter the 6-digit code sent to your email
    </p>

    {% if error %}
    <p class="text-red-400 mb-4">{{ error }}</p>
    {% endif %}

    <form method="POST" class="space-y-8">
        {% csrf_token %}
        <input type="hidden" name="otp" id="finalOtp">

        <!-- OTP BOXES -->
        <div class="flex justify-center gap-3">
            {% for i in "123456" %}
            <input class="otp-input w-12 h-14 text-center text-xl font-bold rounded-xl bg-white/10 border border-white/20 text-white focus:ring-2 focus:ring-yellow-400"
                   maxlength="1" type="text"/>
            {% endfor %}
        </div>

        <button class="w-full py-3 bg-gradient-to-r from-yellow-500 to-yellow-300 text-black font-bold rounded-xl hover:scale-105 transition">
            Verify OTP
        </button>
    </form>

</div>

</section>

<script>
const inputs = document.querySelectorAll(".otp-input");
const hiddenInput = document.getElementById("finalOtp");

inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
        updateOTP();
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && input.value === "" && index > 0) {
            inputs[index - 1].focus();
        }
    });
});

function updateOTP() {
    let otp = "";
    inputs.forEach(input => otp += input.value);
    hiddenInput.value = otp;
}
</script>

{% endblock %}
