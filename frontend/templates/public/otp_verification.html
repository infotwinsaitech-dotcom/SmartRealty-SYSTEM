{% extends "public/base.html" %}
{% block title %}Verify OTP{% endblock %}

{% block content %}

<section class="min-h-[100dvh] flex items-center justify-center luxury-bg px-4 sm:px-6 py-10">

<div class="max-w-md w-full card-luxury text-center reveal">

    <div class="hex-divider mb-3 mx-auto"></div>
    <h2 class="text-2xl sm:text-3xl font-display gold mb-2" style="font-family: 'Playfair Display', serif;">Verify Identity</h2>
    <p class="text-[var(--text-muted)] mb-8 text-sm">
        Enter the 6-digit code sent to your email
    </p>

    {% if error %}
    <p class="text-red-600 mb-4 text-sm">{{ error }}</p>
    {% endif %}

    <form method="POST" class="space-y-7 sm:space-y-8">
        {% csrf_token %}
        <input type="hidden" name="otp" id="finalOtp">

        <!-- OTP BOXES -->
        <div class="flex justify-center gap-2 sm:gap-3">
            {% for i in "123456" %}
            <input class="otp-input w-11 h-13 sm:w-12 sm:h-14 text-center text-xl font-bold rounded-xl bg-[var(--bg-soft)] border border-[var(--border)] text-[var(--navy-deep)] focus:ring-2 focus:ring-[var(--gold-1)] focus:border-[var(--gold-1)] outline-none"
                   maxlength="1" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code"/>
            {% endfor %}
        </div>

        <button class="btn-gold w-full min-h-[52px]">
            Verify OTP
        </button>
    </form>

</div>

</section>

<script>
const inputs = document.querySelectorAll(".otp-input");
const hiddenInput = document.getElementById("finalOtp");

inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
        updateOTP();
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && input.value === "" && index > 0) {
            inputs[index - 1].focus();
        }
    });
});

function updateOTP() {
    let otp = "";
    inputs.forEach(input => otp += input.value);
    hiddenInput.value = otp;
}
</script>

{% endblock %}
