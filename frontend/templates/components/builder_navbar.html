<header class="fixed top-0 left-64 right-0 h-16 bg-white shadow flex items-center justify-between px-4 md:px-6 z-40">

    <!-- Left -->
    <h2 class="font-semibold text-lg">Dashboard</h2>

    <!-- Right -->
    <div class="flex items-center gap-2 md:gap-4">

        <!-- SITE BUTTON: builder ko wapas public website par le jaata hai (naye tab me) -->
        <a href="{% url 'home' %}" target="_blank" rel="noopener"
           class="flex items-center gap-1.5 px-2.5 md:px-3 py-1.5 rounded-lg text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700 transition"
           title="Public site par jaane ke liye">
            <span class="text-base leading-none">🌐</span>
            <span class="hidden sm:inline">Site</span>
        </a>

        <span class="text-sm text-gray-600 hidden md:inline">
            {{ request.user.username }}
        </span>

        <a href="{% url 'notifications' %}" class="relative p-2 hover:bg-gray-100 rounded-full inline-block">
            <span class="text-xl">🔔</span>
            {% if notifications_unread_count > 0 %}
            <span class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full">
                {{ notifications_unread_count }}
            </span>
            {% endif %}
        </a>

        <a href="{% url 'logout' %}" class="text-red-500 text-sm">
            Logout
        </a>
    </div>

</header>
