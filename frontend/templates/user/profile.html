<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | EstateArchitect</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen">

<div class="max-w-6xl mx-auto py-12 px-6">

    <!-- 🔥 Glass Card -->
    <div class="bg-white/70 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-700 to-blue-500 p-8 text-white">
            <h1 class="text-3xl font-extrabold">My Profile</h1>
            <p class="opacity-80 text-sm">Manage your personal information</p>
        </div>

        <!-- Content -->
        <div class="grid md:grid-cols-3 gap-8 p-8">

            <!-- Profile Image -->
            <div class="flex flex-col items-center justify-center">
                <div class="w-36 h-36 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-700 flex items-center justify-center text-white text-4xl font-bold shadow-lg">
                    {{ profile.full_name|slice:":1" }}
                </div>

                <h2 class="mt-4 text-xl font-bold text-gray-800">
                    {{ profile.full_name }}
                </h2>

                <p class="text-gray-500 text-sm">@{{ request.user.username }}</p>
            </div>

            <!-- Details -->
            <div class="md:col-span-2 space-y-6">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Email -->
                    <div class="bg-white rounded-xl p-5 shadow">
                        <p class="text-xs text-gray-500 uppercase">Email</p>
                        <p class="text-lg font-semibold text-gray-800">
                            {{ profile.email }}
                        </p>
                    </div>

                    <!-- Phone -->
                    <div class="bg-white rounded-xl p-5 shadow">
                        <p class="text-xs text-gray-500 uppercase">Phone</p>
                        <p class="text-lg font-semibold text-gray-800">
                            {{ profile.phone }}
                        </p>
                    </div>

                </div>

                <!-- Actions -->
                <div class="flex gap-4 mt-6">

                    <a href="#" class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition">
                        Edit Profile
                    </a>

                    <a href="/logout/" class="px-6 py-3 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition">
                        Logout
                    </a>

<a href="/" class="inline-block mb-6 px-5 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900">
    ← Back to Home
</a>
                </div>

            </div>

        </div>

    </div>

</div>
<div class="flex gap-4 mt-6">

    <a href="{% url 'edit_profile' %}" class="px-4 py-2 bg-blue-500 text-white rounded">
        Edit Profile
    </a>

    <a href="{% url 'my_property' %}" class="px-4 py-2 bg-green-500 text-white rounded">
        My Properties
    </a>

    <a href="{% url 'my_inquiries' %}" class="px-4 py-2 bg-purple-500 text-white rounded">
        My Inquiries
    </a>

    <a href="{% url 'logout' %}" class="px-4 py-2 bg-red-500 text-white rounded">
        Logout
    </a>

</div>
</body>
</html>
