<h2>Edit Profile</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="full_name" value="{{ profile.full_name }}" placeholder="Full Name"><br><br>

    <input type="email" name="email" value="{{ profile.email }}" placeholder="Email"><br><br>

    <input type="text" name="phone" value="{{ profile.phone }}" placeholder="Phone"><br><br>

    <button type="submit">Update</button>
</form>
