{% for property in properties %}
    <div class="bg-white p-4 rounded-lg shadow">
        
        <h3 class="text-xl font-bold">{{ property.title }}</h3>
        <p>{{ property.price }}</p>

        <a href="{% url 'property_detail' property.id %}"
           class="text-blue-500 font-bold">
           View Details →
        </a>

    </div>
{% endfor %}
