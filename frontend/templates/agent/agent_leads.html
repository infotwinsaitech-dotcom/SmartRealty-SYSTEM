<div class="mb-4">

<form method="GET" class="flex gap-2">

<input type="text" name="q"
placeholder="Search..."
class="border p-2 rounded w-full">

<button class="bg-blue-600 text-white px-4 rounded">
Search
</button>

</form>

</div>

{% for lead in leads %}
<div class="bg-white p-4 rounded-xl shadow mb-4">

<div class="flex justify-between">

<div>
<h2 class="font-bold text-lg">{{ lead.name }}</h2>
<p class="text-sm text-gray-500">{{ lead.phone }}</p>
</div>

<span class="text-xs px-2 py-1 rounded
{% if lead.status == 'HOT' %} bg-red-500 text-white
{% elif lead.status == 'WARM' %} bg-yellow-500 text-white
{% else %} bg-gray-500 text-white {% endif %}">
{{ lead.status }}
</span>

</div>

<!-- BUTTONS -->
<div class="flex gap-2 mt-3">

<a href="tel:{{ lead.phone }}"
class="flex-1 bg-green-600 text-white py-2 text-center rounded">
📞 Call
</a>

<a href="https://wa.me/{{ lead.phone }}"
class="flex-1 bg-blue-600 text-white py-2 text-center rounded">
💬 WhatsApp
</a>

</div>

<!-- NOTE -->
<div class="flex gap-2 mt-3">
<input id="note-{{ lead.id }}"
placeholder="Note..."
class="border p-2 rounded w-full">

<button onclick="addNote({{ lead.id }})"
class="bg-black text-white px-3 rounded">
+
</button>
</div>

</div>
{% endfor %}
