<form method="POST" class="space-y-3">
{% csrf_token %}

<select name="lead" class="w-full border p-2 rounded">
{% for lead in leads %}
<option value="{{ lead.id }}">{{ lead.name }}</option>
{% endfor %}
</select>

<input type="date" name="date" class="w-full border p-2 rounded">
<input type="time" name="time" class="w-full border p-2 rounded">

<button class="bg-blue-600 text-white w-full py-2 rounded">
Schedule
</button>

</form>
