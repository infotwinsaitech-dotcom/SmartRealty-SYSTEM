<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Panel</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Manrope', sans-serif; }
</style>
</head>

<body class="bg-gray-100 flex">
<script src="https://cdn.tailwindcss.com"></script>
<!-- MOBILE OVERLAY -->
<div id="overlay" class="fixed inset-0 bg-black/40 hidden z-40" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside id="sidebar"
class="fixed md:relative z-50 left-0 top-0 h-full w-64 bg-[#0F172A] text-white p-6 transform -translate-x-full md:translate-x-0 transition">

<h1 class="text-xl font-bold mb-6">Agent Panel</h1>

<nav class="space-y-3 text-sm">

<a href="{% url 'agent_dashboard' %}" class="block p-2 rounded hover:bg-blue-700">🏠 Dashboard</a>

<a href="{% url 'agent_leads' %}" class="block p-2 rounded hover:bg-blue-700">👤 Leads</a>

<a href="{% url 'agent_properties' %}" class="block p-2 rounded hover:bg-blue-700">🏢 Properties</a>

<a href="{% url 'scheduler' %}" class="block p-2 rounded hover:bg-blue-700">📅 Visits</a>

<a href="{% url 'agent_profile' %}" class="block p-2 rounded hover:bg-blue-700">⚙️ Profile</a>

<a href="/logout/" class="block p-2 rounded hover:bg-red-600">🚪 Logout</a>

</nav>
</aside>

<!-- MAIN -->
<div class="flex-1">

<!-- TOP BAR -->
<div class="bg-white shadow p-3 flex items-center gap-3 md:hidden">

<button onclick="toggleSidebar()">☰</button>
<span class="font-bold">Agent Panel</span>

</div>

<main class="p-4 md:p-8">
{% block content %}
{% endblock %}
</main>

</div>

<script>
function toggleSidebar(){
let sidebar = document.getElementById("sidebar");
let overlay = document.getElementById("overlay");

sidebar.classList.toggle("-translate-x-full");
overlay.classList.toggle("hidden");
}
</script>
<script>
tailwind.config = {
theme: {
extend: {},
},
}
</script>
</body>
</html>
