<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ✅ IMPORTANT -->
    <title>Agent Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>

<body class="bg-gray-100">

<!-- Django Messages (success/error/info/warning) - yahin dikhao taaki login page tak leak na ho -->
{% if messages %}
<div id="django-messages" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm">
    {% for message in messages %}
    <div class="flex items-start gap-2 rounded-lg shadow-lg px-4 py-3 text-sm font-medium border-l-4
        {% if message.tags == 'success' %} bg-white text-green-800 border-green-500
        {% elif message.tags == 'error' %} bg-white text-red-800 border-red-500
        {% elif message.tags == 'warning' %} bg-white text-yellow-800 border-yellow-500
        {% else %} bg-white text-blue-800 border-blue-500
        {% endif %}">
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
<script>
    setTimeout(function() {
        const box = document.getElementById('django-messages');
        if (box) { box.style.transition = 'opacity 0.4s ease'; box.style.opacity = '0'; setTimeout(() => box.remove(), 400); }
    }, 4000);
</script>
{% endif %}

<!-- 🔥 MOBILE TOP BAR (NEW ADD) -->
<div class="md:hidden flex justify-between items-center bg-[#0F172A] text-white p-4">
    <h1 class="font-bold">Agent Panel</h1>
    <button onclick="toggleSidebar()">☰</button>
</div>

<!-- SIDEBAR -->
<aside id="sidebar"
class="fixed left-0 top-0 h-full w-64 bg-[#0F172A] text-white p-6
transform -translate-x-full md:translate-x-0 transition duration-300 z-50">

    <h1 class="text-2xl font-bold mb-10">Agent Panel</h1>

    <nav class="space-y-4">

        <a href="{% url 'agent_dashboard' %}" class="block hover:bg-blue-700 p-2 rounded">
            Dashboard
        </a>

        <a href="{% url 'agent_leads' %}" class="block hover:bg-blue-700 p-2 rounded">
            My Leads
        </a>

        <a href="{% url 'agent_properties' %}" class="block hover:bg-blue-700 p-2 rounded">
            Properties
        </a>

        <a href="{% url 'agent_scheduler' %}" class="flex items-center gap-2 hover:bg-blue-700 p-2 rounded">
            📅 Site Visits
        </a>

        <a href="{% url 'agent_profile' %}" class="block hover:bg-blue-700 p-2 rounded">
            Profile
        </a>

        <a href="/logout/" class="block hover:bg-red-600 p-2 rounded">
            Logout
        </a>

    </nav>

</aside>

<!-- MAIN -->
<main class="p-4 md:p-8 md:ml-64 transition-all duration-300">

    {% block content %}
    {% endblock %}

</main>

<!-- 🔥 JS (NEW ADD) -->
<script>
function toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
}
</script>

</body>
</html>
