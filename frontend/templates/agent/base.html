<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Panel</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: sans-serif; }
</style>

</head>

<body class="bg-gray-100 pb-20">

<!-- TOP BAR -->
<div class="bg-blue-600 text-white p-4 text-lg font-bold">
    Agent Panel
</div>

<!-- CONTENT -->
<div class="p-4">
    {% block content %}
    {% endblock %}
</div>

<!-- 🔥 BOTTOM NAV (VERY IMPORTANT) -->
<div class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around py-2">

    <a href="{% url 'agent_dashboard' %}" class="text-center text-xs">
        🏠 <br> Home
    </a>

    <a href="{% url 'agent_leads' %}" class="text-center text-xs">
        👤 <br> Leads
    </a>

    <a href="{% url 'agent_properties' %}" class="text-center text-xs">
        🏢 <br> Properties
    </a>

    <a href="{% url 'scheduler' %}" class="text-center text-xs">
        📅 <br> Visits
    </a>

    <a href="{% url 'agent_profile' %}" class="text-center text-xs">
        ⚙️ <br> Profile
    </a>

</div>

</body>
</html>
