{% extends "builder/base.html" %}
{% block content %}

<main class="ml-64 mt-16 p-8 bg-gray-50 min-h-screen">

<h1 class="text-2xl font-bold mb-6">Documents</h1>

<!-- UPLOAD FORM -->
<form method="POST" enctype="multipart/form-data"
      class="bg-white p-4 rounded-xl shadow mb-6 flex gap-4 items-center">

    {% csrf_token %}

    <input type="file" name="file" required
           class="border p-2 rounded w-full">

    <select name="category" class="border p-2 rounded">
        <option value="LEGAL">Legal</option>
        <option value="SALES">Sales</option>
        <option value="PROPERTY">Property</option>
    </select>

    <button class="bg-blue-600 text-white px-4 py-2 rounded">
        Upload
    </button>

</form>

<!-- DOCUMENT LIST -->
<div class="bg-white rounded-xl shadow">

    <div class="grid grid-cols-5 p-4 font-bold border-b">
        <div>Name</div>
        <div>Category</div>
        <div>Date</div>
        <div>Preview</div>
        <div>Action</div>
    </div>

    {% for doc in documents %}
    <div class="grid grid-cols-5 p-4 border-b items-center">

        <div>{{ doc.name }}</div>

        <div>{{ doc.category }}</div>

        <div>{{ doc.created_at|date:"d M Y" }}</div>

        <!-- PREVIEW -->
        <div>
            <a href="{{ doc.file.url }}" target="_blank"
               class="text-blue-600">View</a>
        </div>

        <!-- ACTION -->
        <div class="flex gap-3">

            <a href="{{ doc.file.url }}" download
               class="text-green-600">Download</a>

            <a href="{% url 'delete_document' doc.id %}"
               class="text-red-600">Delete</a>

        </div>

    </div>
    {% empty %}
    <div class="p-6 text-center text-gray-400">
        No documents uploaded yet
    </div>
    {% endfor %}

</div>

</main>

{% endblock %}
