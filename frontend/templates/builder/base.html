{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM{% endblock %}</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#dce1ff",
                        "on-surface": "#131b2e",
                        "on-secondary-container": "#fefcff",
                        "surface-tint": "#4059aa",
                        "primary": "#00236f",
                        "tertiary-fixed-dim": "#b9c7e0",
                        "secondary-container": "#2170e4",
                        "on-tertiary-fixed": "#0d1c2f",
                        "surface-container-high": "#e2e7ff",
                        "on-secondary-fixed-variant": "#004395",
                        "on-surface-variant": "#444651",
                        "surface-bright": "#faf8ff",
                        "on-tertiary-fixed-variant": "#3a485c",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#334155",
                        "primary-fixed-dim": "#b6c4ff",
                        "outline-variant": "#c5c5d3",
                        "surface-dim": "#d2d9f4",
                        "surface-container-highest": "#dae2fd",
                        "surface-container": "#eaedff",
                        "primary-container": "#1e3a8a",
                        "on-primary": "#ffffff",
                        "surface": "#faf8ff",
                        "on-primary-fixed-variant": "#264191",
                        "background": "#faf8ff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#00164e",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f2f3ff",
                        "on-secondary-fixed": "#001a42",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#d8e2ff",
                        "on-tertiary-container": "#9eadc5",
                        "inverse-on-surface": "#eef0ff",
                        "inverse-surface": "#283044",
                        "inverse-primary": "#b6c4ff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#d5e3fd",
                        "surface-variant": "#dae2fd",
                        "secondary-fixed-dim": "#adc6ff",
                        "tertiary": "#1d2b3e",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#757682",
                        "secondary": "#0058be",
                        "on-error": "#ffffff",
                        "on-background": "#131b2e",
                        "on-primary-container": "#90a8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- Custom Style -->
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-icon { font-variation-settings: 'FILL' 1; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-surface text-on-surface m-0 h-screen flex overflow-hidden">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Backdrop (मोबाइल पर साइडबार खुलने पर पीछे धुंधला/ब्लैक करने के लिए) -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar Wrapper -->
    <div id="sidebar-wrapper" class="fixed inset-y-0 left-0 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:flex flex-col flex-shrink-0">
        {% include 'components/sidebar.html' %}
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <!-- Navbar Wrapper (अब इसमें मोबाइल मेनू बटन और नोटिफिकेशन भी है) -->
        <header class="bg-surface-container flex items-center justify-between px-4 py-3 border-b border-outline-variant">
            <!-- लेफ्ट साइड: मोबाइल मेनू बटन और ब्रांड -->
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="p-1 rounded-md hover:bg-surface-variant md:hidden">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                {% include 'components/builder_navbar.html' %}
            </div>

            <!-- राइट साइड: नोटिफिकेशन बेल -->
            <div class="flex items-center gap-4">
                <a href="{% url 'notifications' %}" class="relative p-2 hover:bg-surface-variant rounded-full inline-block">
                    <span class="text-xl">🔔</span>
                    {% if notifications_unread_count > 0 %}
                    <span class="absolute top-0 right-0 bg-error text-on-primary text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full">
                        {{ notifications_unread_count }}
                    </span>
                    {% endif %}
                </a>
            </div>
        </header>

        <!-- Dynamic Content Space -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-6 bg-background">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <!-- Sidebar Open/Close Script -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-wrapper');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
