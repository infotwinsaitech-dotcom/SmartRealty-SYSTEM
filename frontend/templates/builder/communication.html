{% extends "builder/base.html" %}
{% block content %}

<div class="h-[calc(100vh-60px)] flex flex-col md:flex-row">

<!-- LEFT: CHAT LIST -->
<div id="chatList"
     class="w-full md:w-80 bg-gray-100 p-3 md:p-4 overflow-y-auto
     border-r">

    <h2 class="font-bold text-lg mb-4">Inbox</h2>

    {% for convo in conversations %}
    <div onclick="openChat({{ convo.id }})"
         class="p-3 border-b cursor-pointer hover:bg-gray-200 rounded">

        <b class="text-sm md:text-base">{{ convo.lead_name }}</b>
        <p class="text-xs text-gray-500">{{ convo.lead_phone }}</p>

    </div>
    {% endfor %}

</div>

<!-- RIGHT: CHAT WINDOW -->
<div id="chatWindow"
     class="flex-1 flex flex-col hidden md:flex">

    <!-- HEADER -->
    <div class="p-3 md:p-4 bg-white border-b font-bold flex items-center gap-2">

        <!-- BACK BUTTON (mobile only) -->
        <button onclick="backToList()"
                class="md:hidden text-xl">
            ←
        </button>

        <span id="chatTitle">
            {{ active_chat.lead_name }}
        </span>
    </div>

    <!-- MESSAGES -->
    <div id="chatBox"
         class="flex-1 p-3 md:p-4 overflow-y-auto space-y-2 bg-gray-50">

        {% for msg in messages %}
        <div class="{% if msg.is_agent %}text-right{% endif %}">
            <span class="inline-block px-3 py-2 rounded text-sm
                {% if msg.is_agent %}
                    bg-blue-600 text-white
                {% else %}
                    bg-gray-200
                {% endif %}">
                {{ msg.text }}
            </span>
        </div>
        {% endfor %}

    </div>

    <!-- INPUT -->
    <div class="p-3 md:p-4 bg-white border-t flex gap-2">

        <input id="messageInput" type="text"
               placeholder="Type a message..."
               class="border p-2 w-full rounded text-sm">

        <button onclick="sendMessage()"
                class="bg-blue-600 text-white px-4 rounded text-sm">
            Send
        </button>

    </div>

</div>

</div>

<script>

let currentConvoId = null;

/* ✅ OPEN CHAT */
function openChat(convoId){
    currentConvoId = convoId;

    // mobile view switch
    document.getElementById("chatList").classList.add("hidden");
    document.getElementById("chatWindow").classList.remove("hidden");

    loadMessages();
}

/* ✅ BACK TO LIST (mobile) */
function backToList(){
    document.getElementById("chatList").classList.remove("hidden");
    document.getElementById("chatWindow").classList.add("hidden");
}

/* ✅ LOAD MESSAGES */
function loadMessages(){

    if(!currentConvoId) return;

    fetch(`/get-messages/?conversation_id=${currentConvoId}`)
    .then(res => res.json())
    .then(data => {

        let chatBox = document.getElementById("chatBox");
        chatBox.innerHTML = "";

        data.messages.forEach(msg => {

            chatBox.innerHTML += `
                <div class="${msg.is_agent ? 'text-right' : 'text-left'} mb-2">
                    <span class="px-3 py-2 rounded inline-block text-sm
                        ${msg.is_agent ? 'bg-blue-500 text-white' : 'bg-gray-300'}">
                        ${msg.text}
                    </span>
                </div>
            `;
        });

        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

/* ✅ SEND MESSAGE */
function sendMessage(){

    let input = document.getElementById("messageInput");
    let text = input.value;

    if(!currentConvoId || !text) return;

    fetch("/agent/send-message/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            conversation_id: currentConvoId,
            message: text
        })
    }).then(() => {
        input.value = "";
        loadMessages();
    });
}

/* ✅ AUTO REFRESH */
setInterval(loadMessages, 2000);

</script>

{% endblock %}
