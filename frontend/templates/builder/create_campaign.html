{% extends 'builder/base.html' %}

{% block content %}

<main class="min-h-screen bg-gray-50 p-4 md:p-8">
<div class="max-w-3xl mx-auto">

<h2 class="text-xl md:text-2xl font-bold mb-4 md:mb-6">
    Create Campaign
</h2>

<form method="POST" enctype="multipart/form-data"
      class="bg-white p-4 md:p-6 rounded-xl shadow space-y-3 md:space-y-4">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Campaign Name"
        class="w-full border px-3 py-2 md:px-4 md:py-2.5 rounded text-sm md:text-base"
        required>

    <input type="number" name="reach" placeholder="Total Reach"
        class="w-full border px-3 py-2 md:px-4 md:py-2.5 rounded text-sm md:text-base">

    <input type="number" name="clicked" placeholder="Clicks"
        class="w-full border px-3 py-2 md:px-4 md:py-2.5 rounded text-sm md:text-base">

    <input type="number" name="conversion" placeholder="Conversions"
        class="w-full border px-3 py-2 md:px-4 md:py-2.5 rounded text-sm md:text-base">

    <!-- IMAGE FIELD -->
    <input type="file" name="image"
        class="w-full border p-2 rounded text-sm md:text-base">

    <button
        class="w-full md:w-auto bg-blue-600 text-white px-6 py-2.5 rounded font-semibold">
        Create Campaign
    </button>

</form>

</div>
</main>

{% endblock %}
