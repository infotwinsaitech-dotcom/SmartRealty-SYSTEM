{% extends "builder/base.html" %}
{% block content %}

<main class="ml-64 mt-16 p-8 bg-gray-100 min-h-screen">

<h1 class="text-2xl font-bold mb-6">🔔 Notifications</h1>

<div class="space-y-4">

{% for n in notifications %}
<div onclick="markRead({{ n.id }})"
     class="bg-white p-4 rounded-xl shadow flex justify-between items-center cursor-pointer
     {% if not n.is_read %}border-l-4 border-blue-500{% endif %}">

    <div>
        <p class="font-semibold">{{ n.title }}</p>
        <p class="text-sm text-gray-500">{{ n.message }}</p>
        <p class="text-xs text-gray-400 mt-1">{{ n.created_at }}</p>
    </div>

    <span class="px-3 py-1 text-xs rounded
        {% if n.type == 'lead' %}bg-blue-100 text-blue-600
        {% elif n.type == 'message' %}bg-green-100 text-green-600
        {% elif n.type == 'task' %}bg-yellow-100 text-yellow-600
        {% elif n.type == 'document' %}bg-purple-100 text-purple-600
        {% endif %}
    ">
        {{ n.type }}
    </span>

</div>
{% endfor %}

</div>

</main>

<script>
function markRead(id){
    fetch(`/mark-notification/${id}/`)
    .then(() => {
        location.reload();
    });
}
</script>

{% endblock %}
